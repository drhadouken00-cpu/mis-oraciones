<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0907">
<link rel="icon" href="../icons/icon-192.png">
<title>Visita al Santísimo · prueba</title>
<style>
:root{--gold:#d4af5a;--gold2:#a8864b;--ivory:#f3eee3;--ink:#0b0907;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--ivory);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.serif{font-family:Georgia,"Times New Roman",serif}
/* ---------- Ajustes ---------- */
#setup{min-height:100%;max-width:560px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top .eyebrow{flex:1;min-width:0}.lang{flex:0 0 auto}
.eyebrow{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.lang{display:flex;border:1px solid #4a3f2c;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 12px;font-size:12px;font-weight:600;color:#bfb39a}
.lang button[aria-pressed=true]{background:var(--gold2);color:#140f08}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;line-height:1.15;margin:0}
h1 em{color:var(--gold)}
.lead{margin:-8px 0 0;color:#cdbfa3}
h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#bfa978;margin:0 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#1a1510;border:1px solid #3a3122;border-radius:999px;padding:9px 15px;min-width:64px}
.chips button[aria-pressed=true]{background:var(--gold2);border-color:var(--gold2);color:#140f08;font-weight:700}
.custom{display:flex;align-items:center;gap:8px;margin-top:10px;color:#cdbfa3;font-size:14px}
.custom input{width:84px;background:#1a1510;border:1px solid #3a3122;border-radius:10px;color:var(--ivory);padding:8px 10px;font:inherit}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pics button{position:relative;padding:0;border:2px solid transparent;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4}
.pics img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.pics span{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 6px;font-size:11.5px;line-height:1.2;background:linear-gradient(transparent,rgba(0,0,0,.85));text-align:center}
.pics button[aria-pressed=true]{border-color:var(--gold)}
.pics button[aria-pressed=true] img{opacity:1}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #2a2319;font-size:15px}
.sw small{display:block;color:#a99c82;font-size:12.5px}
.sw input{appearance:none;width:46px;height:28px;border-radius:999px;background:#3a3122;position:relative;flex:0 0 46px;transition:.2s;cursor:pointer}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#e9dfca;transition:.2s}
.sw input:checked{background:var(--gold2)}.sw input:checked::after{left:21px}
select{background:#1a1510;color:var(--ivory);border:1px solid #3a3122;border-radius:10px;padding:6px 8px;font:inherit;font-size:14px}
#start{margin-top:4px;background:linear-gradient(180deg,#d9b866,#a8864b);color:#140f08;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:700;box-shadow:0 8px 30px rgba(212,175,90,.25)}
.note{color:#8f8470;font-size:12px;margin:0}
.credit{color:#7d735f;font-size:11.5px;margin:0}
.credit a{color:#a99c82}
/* ---------- Adoración ---------- */
#adore{position:fixed;inset:0;background:#000;overflow:hidden;cursor:none;touch-action:manipulation}
#adore[hidden],#setup[hidden],#end[hidden]{display:none}
#pic{position:absolute;background-repeat:no-repeat;background-size:100% 100%;transform-origin:var(--fx) var(--fy);animation:drift 90s ease-in-out infinite alternate;will-change:transform;filter:brightness(.7) saturate(.92)}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}
.fx{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);pointer-events:none;mix-blend-mode:screen;will-change:transform,opacity}
#glow{background:radial-gradient(circle,rgba(255,248,222,.95) 0,rgba(255,226,158,.62) 6%,rgba(236,186,96,.40) 17%,rgba(214,162,72,.20) 33%,rgba(200,150,60,.07) 50%,transparent 68%);animation:breathe 10s infinite}
#core{--s:calc(var(--h) * 3.2);background:radial-gradient(circle,rgba(255,255,248,.9) 0,rgba(255,248,225,.45) 35%,transparent 70%);animation:breatheCore 10s infinite}
#rays{background:repeating-conic-gradient(from 0deg,rgba(255,228,165,.28) 0deg 1.6deg,transparent 1.4deg 15deg);-webkit-mask:radial-gradient(circle,#000 6%,rgba(0,0,0,.55) 30%,transparent 64%);mask:radial-gradient(circle,#000 6%,rgba(0,0,0,.55) 30%,transparent 64%);animation:spin 160s linear infinite,raysB 10s infinite}
#rays2{background:repeating-conic-gradient(from 7deg,rgba(255,238,196,.18) 0deg .9deg,transparent .8deg 22deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 55%);mask:radial-gradient(circle,#000 5%,transparent 55%);animation:spin 240s linear infinite reverse,raysB2 10s infinite}
/* Respiración tranquila (~6 por minuto): inspirar ~3,8 s, pausa breve, espirar ~5,4 s, pausa breve. Nunca se apaga (mín. ≈45 %). */
@keyframes breathe{0%,4%{transform:scale(.9);opacity:.45;animation-timing-function:cubic-bezier(.45,0,.55,1)}42%,46%{transform:scale(1.06);opacity:1;animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{transform:scale(.9);opacity:.45}}
@keyframes breatheCore{0%,4%{transform:scale(.94);opacity:.55;animation-timing-function:cubic-bezier(.45,0,.55,1)}42%,46%{transform:scale(1.04);opacity:1;animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{transform:scale(.94);opacity:.55}}
@keyframes raysB{0%,4%{opacity:.4;animation-timing-function:cubic-bezier(.45,0,.55,1)}42%,46%{opacity:.95;animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{opacity:.4}}
@keyframes raysB2{0%,4%{opacity:.5;animation-timing-function:cubic-bezier(.45,0,.55,1)}42%,46%{opacity:1;animation-timing-function:cubic-bezier(.45,0,.55,1)}100%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
#dust{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at var(--x) var(--y),transparent 30%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.92) 100%)}
#veil{position:absolute;inset:0;background:#000;opacity:1;transition:opacity 3.5s ease;pointer-events:none}
#adore.on #veil{opacity:0}
#adore.ending #veil{opacity:1;transition-duration:5s}
#hud{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transition:opacity .8s;pointer-events:none}
#adore.reveal #hud{opacity:1;pointer-events:auto}
#adore.reveal{cursor:default}
#left{font-family:Georgia,serif;font-size:22px;letter-spacing:.06em;color:rgba(243,238,227,.85);text-shadow:0 1px 8px #000}
#exit{background:rgba(20,16,10,.55);border:1px solid rgba(212,175,90,.45);color:var(--ivory);border-radius:999px;padding:9px 20px;font-size:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#dot{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:rgba(243,238,227,.14);transition:opacity .8s}
#adore.reveal #dot{opacity:0}
/* ---------- Final ---------- */
#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 42%,#2a2010 0,#0b0907 62%)}
#end .mono{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle,#fff8e6 0,#f1d9a0 30%,rgba(212,175,90,.25) 60%,transparent 72%);animation:breathe 10s infinite}
#end p.big{font-family:Georgia,serif;font-size:27px;line-height:1.3;margin:0;max-width:520px}
#end p.sub{margin:0;color:var(--gold);font-family:Georgia,serif;font-style:italic;font-size:19px}
#end button{margin-top:14px;background:none;border:1px solid var(--gold2);border-radius:999px;padding:11px 26px;color:var(--ivory)}
#end{opacity:0;transition:opacity 2.5s}#end.on{opacity:1}
@media (prefers-reduced-motion:reduce){#pic,#glow,#core,#rays,#rays2,#end .mono{animation:none!important}#glow,#core{opacity:.9}}
@media (min-width:900px){#setup{padding-top:48px}h1{font-size:40px}}
</style>
</head>
<body>
<main id="setup">
 <div class="top"><span class="eyebrow" data-t="eyebrow"></span><div class="lang" role="group" aria-label="Idioma"><button data-l="es">ES</button><button data-l="en">EN</button></div></div>
 <h1 data-th="title"></h1>
 <p class="lead" data-t="lead"></p>
 <section><h2 data-t="dur"></h2><div class="chips" id="mins"></div>
  <label class="custom"><span data-t="custom"></span><input id="cmin" type="number" min="1" max="180" inputmode="numeric" placeholder="25"><span>min</span></label></section>
 <section><h2 data-t="img"></h2><div class="pics" id="pics"></div></section>
 <section>
  <label class="sw"><span><span data-t="music"></span><small data-t="musicSub"></small></span><input type="checkbox" id="music"></label>
  <div class="sw" id="trackRow" hidden><span data-t="track"></span><select id="track"><option value="cello"></option><option value="violin"></option></select></div>
  <label class="sw"><span><span data-t="bell"></span><small data-t="bellSub"></small></span><input type="checkbox" id="bell" checked></label>
 </section>
 <button id="start"></button>
 <p class="note" data-t="note"></p>
 <p class="credit" id="credit"></p>
</main>
<section id="adore" hidden aria-label="Adoración">
 <div id="pic"></div>
 <div class="fx" id="rays2"></div><div class="fx" id="rays"></div><div class="fx" id="glow"></div><div class="fx" id="core"></div>
 <canvas id="dust"></canvas>
 <div id="vig"></div>
 <div id="dot" aria-hidden="true"></div>
 <div id="hud"><div id="left">00:00</div><button id="exit"></button></div>
 <div id="veil"></div>
</section>
<section id="end" hidden><div class="mono" aria-hidden="true"></div><p class="big" data-t="praise"></p><p class="sub" data-t="praise2"></p><button id="again" data-t="back"></button></section>
<audio id="aud" loop preload="none"></audio>
<script>
'use strict';
const $=id=>document.getElementById(id);
const TX={
 es:{eyebrow:'Visita al Santísimo · prueba',title:'Quédate con Él.<br><em>Sin prisa.</em>',lead:'La pantalla se queda solo con la imagen y una luz suave que respira despacio. Sin letras. Toca la pantalla si necesitas ver el tiempo.',
  dur:'¿Cuánto tiempo?',custom:'Otro:',img:'Imagen',music:'Música de fondo',musicSub:'Ave María instrumental, muy bajita',track:'Pieza',cello:'Violonchelo (Bach-Gounod)',violin:'Violín (Schubert)',
  bell:'Campana suave al terminar',bellSub:'Un solo toque, muy suave',start:n=>`Empezar · ${n} min`,note:'Consejo: pon el móvil en silencio o en modo avión. La pantalla se mantendrá encendida si tu navegador lo permite.',noWake:'Tu navegador no puede mantener la pantalla encendida: sube el tiempo de apagado de pantalla en los ajustes del móvil.',
  exit:'Terminar',praise:'Alabado sea el Santísimo Sacramento del altar.',praise2:'Sea por siempre bendito y alabado.',back:'‹ Volver',
  pics:{custodia:'Custodia expuesta',disputa:'Rafael · La Disputa',juanes:'Juan de Juanes · El Salvador'},
  credit:'Imágenes: custodia en St. Gabriel (Connersville), foto de Nheyob, CC0 · Rafael, «Disputa del Sacramento» (1509-1510), dominio público · Juan de Juanes, «El Salvador» (Museo del Prado), dominio público. Música: «Ave María» (Bach-Gounod), violonchelo de John Michel, CC BY-SA 3.0; «Ave María» (Schubert), violín de Katy Adelson, CC BY 3.0 — Wikimedia Commons.'},
 en:{eyebrow:'Visit to the Blessed Sacrament · preview',title:'Stay with Him.<br><em>Unhurried.</em>',lead:'The screen shows only the image and a soft light that breathes slowly. No text. Tap the screen if you need to see the time.',
  dur:'How long?',custom:'Other:',img:'Image',music:'Background music',musicSub:'Instrumental Ave Maria, very soft',track:'Piece',cello:'Cello (Bach-Gounod)',violin:'Violin (Schubert)',
  bell:'Soft bell at the end',bellSub:'A single, very gentle tone',start:n=>`Begin · ${n} min`,note:'Tip: silence your phone or use airplane mode. The screen will stay on if your browser allows it.',noWake:'Your browser cannot keep the screen on: increase the screen timeout in your phone settings.',
  exit:'Finish',praise:'Praised be the Most Blessed Sacrament of the altar.',praise2:'Forever blessed and praised.',back:'‹ Back',
  pics:{custodia:'Exposed monstrance',disputa:'Raphael · The Disputation',juanes:'Juan de Juanes · The Saviour'},
  credit:'Images: monstrance at St. Gabriel (Connersville), photo by Nheyob, CC0 · Raphael, “Disputation of the Holy Sacrament” (1509–1510), public domain · Juan de Juanes, “The Saviour” (Prado Museum), public domain. Music: “Ave Maria” (Bach-Gounod), cello by John Michel, CC BY-SA 3.0; “Ave Maria” (Schubert), violin by Katy Adelson, CC BY 3.0 — Wikimedia Commons.'}};
// fx, fy: origen de la luz (la Hostia; en Rafael, el Espíritu Santo) como fracción de la imagen; hr: radio de la Hostia (fracción del ancho); g: tamaño del aura
const IMGS={custodia:{src:'img/custodia.webp',w:1100,h:1410,fx:.5,fy:.5,hr:.032,g:1},disputa:{src:'img/disputa.webp',w:1000,h:1614,fx:.502,fy:.452,hr:.05,g:.95,c:.5},juanes:{src:'img/juanes.webp',w:1200,h:1605,fx:.2267,fy:.5053,hr:.065,g:.8}};
const TRACKS={cello:'../music/john-michel-ave-maria.mp3',violin:'../music/katy-adelson-ave-maria.mp3'};
const qs=new URLSearchParams(location.search);
let lang=qs.get('lang')||(()=>{try{return localStorage.getItem('moLang')}catch{return null}})()||((navigator.language||'').startsWith('es')?'es':'en');if(!TX[lang])lang='es';
let mins=Number(qs.get('min'))||20,pick=qs.get('img')in IMGS?qs.get('img'):'custodia';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function t(k){return TX[lang][k]}
function render(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll('[data-th]').forEach(e=>e.innerHTML=t(e.dataset.th));
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
 $('mins').replaceChildren(...[5,10,15,20,30,45,60].map(m=>{const b=document.createElement('button');b.textContent=m+' min';b.setAttribute('aria-pressed',m===mins&&!$('cmin').value);b.onclick=()=>{mins=m;$('cmin').value='';render()};return b}));
 $('pics').replaceChildren(...Object.entries(IMGS).map(([k,v])=>{const b=document.createElement('button');b.setAttribute('aria-pressed',k===pick);b.innerHTML=`<img src="${v.src}" alt=""><span></span>`;b.querySelector('span').textContent=t('pics')[k];b.onclick=()=>{pick=k;render()};return b}));
 $('track').options[0].textContent=t('cello');$('track').options[1].textContent=t('violin');
 $('start').textContent=t('start')(mins);$('exit').textContent=t('exit');$('credit').textContent=t('credit');
 $('trackRow').hidden=!$('music').checked;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
$('cmin').oninput=e=>{const v=Math.round(Number(e.target.value));if(v>=1&&v<=180){mins=v;render();$('cmin').focus()}};
$('music').onchange=render;
if(!('wakeLock' in navigator)){TX.es.note+=' '+TX.es.noWake;TX.en.note+=' '+TX.en.noWake}
render();

// ---------- Adoración ----------
let endAt=0,tick=0,wake=null,revealT=0,raf=0,running=false,audioCtx=null;
const aud=$('aud');
async function keepAwake(){try{if('wakeLock' in navigator&&!document.hidden){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}}catch{wake=null}}
document.addEventListener('visibilitychange',()=>{if(running&&!document.hidden&&!wake)keepAwake();if(running)document.hidden?stopDust():startDust()});
function layout(){
 const I=IMGS[pick],W=innerWidth,H=innerHeight,s=Math.max(W/I.w,H/I.h),w=I.w*s,h=I.h*s;
 // «cover» desplazado para dejar la Hostia lo más centrada posible
 const x=Math.min(0,Math.max(W-w,W/2-I.fx*w)),y=Math.min(0,Math.max(H-h,H*.46-I.fy*h));
 const p=$('pic');Object.assign(p.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',backgroundImage:`url("${I.src}")`});
 p.style.setProperty('--fx',I.fx*100+'%');p.style.setProperty('--fy',I.fy*100+'%');
 const hx=x+I.fx*w,hy=y+I.fy*h,hr=I.hr*w,a=$('adore').style;
 a.setProperty('--x',hx+'px');a.setProperty('--y',hy+'px');a.setProperty('--h',hr+'px');
 const g=Math.max(hr*14,Math.min(W,H)*.9)*I.g;
 $('core').style.filter=I.c?`opacity(${I.c})`:'';  // c: intensidad del núcleo (en Rafael más suave para que se vea la paloma)
 for(const [id,k] of [['glow',1],['rays',1.25],['rays2',1.5]])$(id).style.setProperty('--s',g*k+'px');
 dustOrigin={x:hx,y:hy,r:g*.45};sizeCanvas();
}
// Partículas de luz muy tenues (Canvas, ~24 fps, se detienen con la pantalla oculta)
const cv=$('dust'),cx=cv.getContext('2d');let parts=[],dustOrigin={x:0,y:0,r:200},last=0;
function sizeCanvas(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
function seed(p){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*dustOrigin.r*1.6;p.x=dustOrigin.x+Math.cos(a)*r;p.y=dustOrigin.y+Math.sin(a)*r;p.vx=(Math.random()-.5)*.08;p.vy=-(.05+Math.random()*.12);p.s=.6+Math.random()*1.6;p.life=0;p.max=600+Math.random()*900;return p}
function frame(ts){raf=requestAnimationFrame(frame);if(ts-last<41)return;const dt=Math.min(3,(ts-last)/41);last=ts;
 cx.clearRect(0,0,innerWidth,innerHeight);
 for(const p of parts){p.life+=dt*1;p.x+=p.vx*dt*4;p.y+=p.vy*dt*4;const k=p.life/p.max;if(k>=1){seed(p);continue}
  const al=Math.sin(Math.PI*k)*.5*(.6+.4*breath());cx.globalAlpha=al;const gr=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*3);gr.addColorStop(0,'rgba(255,240,200,1)');gr.addColorStop(1,'rgba(255,220,150,0)');cx.fillStyle=gr;cx.beginPath();cx.arc(p.x,p.y,p.s*3,0,7);cx.fill()}
 cx.globalAlpha=1}
// Fase de la respiración (0 = espirado, 1 = inspirado), leída de la animación CSS del aura para ir sincronizados
function breath(){try{const an=$('glow').getAnimations().find(a=>a.animationName==='breathe');const t=((an?an.currentTime:performance.now())%10000)/1000,E=u=>.5-.5*Math.cos(Math.PI*u);
 return t<.4?0:t<4.2?E((t-.4)/3.8):t<4.6?1:E(1-(t-4.6)/5.4)}catch{return .5}}
// Para capturas/pruebas: congela la respiración en una fase (0 o 1) o la reanuda (null)
function hold(b){const ms=b==null?null:(b?4400:200);for(const id of ['glow','core','rays','rays2'])for(const an of $(id).getAnimations()){if(!/^(breathe|breatheCore|raysB|raysB2)$/.test(an.animationName))continue;if(ms==null)an.play();else{an.currentTime=ms;an.pause()}}}
function startDust(){if(reduce||raf)return;if(!parts.length)parts=Array.from({length:Math.round(Math.min(46,innerWidth*innerHeight/9000))},()=>{const p=seed({});p.life=Math.random()*p.max;return p});last=performance.now();raf=requestAnimationFrame(frame)}
function stopDust(){cancelAnimationFrame(raf);raf=0}
addEventListener('resize',()=>{if(running)layout()});
const fmt=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
function reveal(){const a=$('adore');$('left').textContent=fmt((endAt-Date.now())/1000);a.classList.add('reveal');clearTimeout(revealT);revealT=setTimeout(()=>a.classList.remove('reveal'),3000)}
$('adore').addEventListener('click',e=>{if(e.target.id==='exit')return;reveal()});
$('exit').onclick=e=>{e.stopPropagation();finish(false)};
function fadeAudio(to,ms,done){if(aud.paused){done&&done();return}const from=aud.volume,t0=performance.now();(function step(n){const k=Math.min(1,(n-t0)/ms);aud.volume=Math.max(0,from+(to-from)*k);k<1?requestAnimationFrame(step):done&&done()})(t0)}
function bell(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const c=audioCtx,s=c.currentTime+.05;
 for(const [f,v] of [[523.25,.09],[1046.5,.03],[1568,.012]]){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+5.5);o.start(s);o.stop(s+5.6)}}catch{}}
async function start(){
 if(!(mins>=1))mins=20;
 $('setup').hidden=true;$('end').hidden=true;const a=$('adore');a.hidden=false;a.className='';
 try{if(document.documentElement.requestFullscreen&&!document.fullscreenElement)await document.documentElement.requestFullscreen({navigationUI:'hide'})}catch{}
 keepAwake();running=true;layout();startDust();
 // desbloquea el audio dentro del gesto del usuario
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch{}
 if($('music').checked){aud.src=TRACKS[$('track').value];aud.volume=0;aud.play().then(()=>fadeAudio(.12,6000)).catch(()=>{})}
 endAt=Date.now()+mins*60000;
 requestAnimationFrame(()=>requestAnimationFrame(()=>a.classList.add('on')));
 clearInterval(tick);tick=setInterval(()=>{if(Date.now()>=endAt)finish(true);else if(a.classList.contains('reveal'))$('left').textContent=fmt((endAt-Date.now())/1000)},500);
}
function finish(natural){
 clearInterval(tick);const a=$('adore');a.classList.remove('reveal');a.classList.add('ending');
 if(natural){if($('bell').checked)bell();try{navigator.vibrate&&navigator.vibrate([40,120,40])}catch{}}
 fadeAudio(0,4000,()=>aud.pause());
 setTimeout(()=>{running=false;stopDust();a.hidden=true;try{wake&&wake.release()}catch{}wake=null;const e=$('end');e.hidden=false;requestAnimationFrame(()=>e.classList.add('on'))},natural?5200:1200);
}
$('again').onclick=()=>{const e=$('end');e.classList.remove('on');e.hidden=true;$('setup').hidden=false;try{document.fullscreenElement&&document.exitFullscreen()}catch{}scrollTo(0,0)};
$('start').onclick=start;
window.SANTI={start,finish,layout,hold,breath,state:()=>({running,endAt,wake:!!wake,pick,mins,lang,reduce})};
</script>
